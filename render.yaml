services:
  # Backend API Service
  - type: web
    name: social-media-agent-api
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: cd agent && pip install -r requirements-render.txt
    startCommand: cd agent && python simple_api.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: LLM_PROVIDER
        value: gemini
      - key: DEFAULT_MODEL
        value: gemini-flash-latest
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_TEMPERATURE
        value: 0.7
      - key: LLM_MAX_TOKENS
        value: 8192
    healthCheckPath: /

  # Frontend Web Service
  - type: web
    name: social-media-agent-frontend
    runtime: node
    region: oregon
    plan: free
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run preview -- --host 0.0.0.0 --port $PORT
    envVars:
      - key: NODE_VERSION
        value: 18.18.0
      - key: VITE_API_URL
        fromService:
          type: web
          name: social-media-agent-api
          envVarKey: RENDER_EXTERNAL_URL
